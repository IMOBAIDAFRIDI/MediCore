# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render asks for the values marked sync: false.
services:
  - type: web
    name: medicore
    runtime: docker
    plan: free
    healthCheckPath: /login.php
    envVars:
      # TiDB Cloud Starter (MySQL compatible) → Connect → host / user / password
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: test
      - key: DB_SSL
        value: "1"
      # Private admin password for admin@medicore (random, generated by Render)
      - key: ADMIN_PASSWORD
        generateValue: true
      # Optional: Gmail address + app password for appointment emails
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
